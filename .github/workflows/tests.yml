name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q tools tests
      - name: Validate the built-in plan
        run: python -m tools.acm_agent plan check --json

  launcher-and-credentials-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked Unix Dashboard dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --requirement tools/requirements-web-unix.lock
      - name: Run macOS launcher tests
        run: python -m unittest discover -s tests -p "test_*launcher.py" -v
      - name: Test macOS Keychain credential round trip
        env:
          ACM_TEST_SYSTEM_KEYRING: "1"
        run: python -m unittest tests.test_credentials -v
