name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q tools tests
      - name: Validate the built-in plan
        run: python -m tools.acm_agent plan check --json

  launcher-and-credentials-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked Unix Dashboard dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --requirement tools/requirements-web-unix.lock
      - name: Run macOS launcher tests
        run: python -m unittest discover -s tests -p "test_*launcher.py" -v
      - name: Test macOS Keychain credential round trip
        env:
          ACM_TEST_SYSTEM_KEYRING: "1"
        run: python -m unittest tests.test_credentials -v

  unix-web-runtime-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the launcher-pinned uv
        run: python -m pip install uv==0.12.5
      - name: Verify the universal lock is reproducible
        if: matrix.python-version == '3.13'
        run: |
          python -m uv pip compile tools/requirements-web-unix.in \
            --output-file "${RUNNER_TEMP}/requirements-web-unix.lock" \
            --universal --python-version 3.10 --generate-hashes \
            --only-binary=:all: --no-annotate --no-header --no-config \
            --no-python-downloads --upgrade
          diff -u tools/requirements-web-unix.lock "${RUNNER_TEMP}/requirements-web-unix.lock"
      - name: Exercise the real Unix Web launcher dependency path
        run: |
          web_python=$(sh tools/ensure-python313.sh "$PWD")
          "$web_python" - <<'PY'
          import cffi
          import cryptography
          import keyring
          import keyring.backends.SecretService
          import secretstorage
          PY
